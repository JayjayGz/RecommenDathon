[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Deterministic educational portfolio simulation"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "boto3[crt]"]

[tool.setuptools.packages.find]
where = ["src"]
